<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Тёмный фон в стиле приложения -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Изумрудно-зелёный градиент бронзового/металлического щита -->
    <linearGradient id="shieldMain" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Внутренняя затемнённая часть щита -->
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Блик для объёма -->
    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Свечение за щитом -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Подложка иконки (Tauri сам обрежет углы под macOS/iOS/Android при генерации) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)" />

  <!-- Тонкая декоративная рамка -->
  <rect x="24" y="24" width="976" height="976" rx="204" fill="none" stroke="#10b981" stroke-opacity="0.18" stroke-width="4" />

  <!-- Мягкое зелёное свечение на фоне -->
  <circle cx="512" cy="512" r="290" fill="#10b981" opacity="0.12" filter="url(#emeraldGlow)" />

  <!-- Внешний контур античного щита -->
  <path d="M512 156
           C620 202, 725 224, 816 232
           C816 496, 742 716, 512 872
           C282 716, 208 496, 208 232
           C299 224, 404 202, 512 156 Z"
        fill="url(#shieldMain)"
        stroke="url(#rimHighlight)"
        stroke-width="10"
        stroke-linejoin="round" />

  <!-- Внутренний рельефный обод античного щита (Aspis / Scutum) -->
  <path d="M512 204
           C606 244, 696 263, 772 270
           C770 496, 706 686, 512 820
           C318 686, 254 496, 252 270
           C328 263, 418 244, 512 204 Z"
        fill="url(#shieldInner)"
        stroke="#6ee7b7"
        stroke-opacity="0.55"
        stroke-width="5" />

  <!-- Античный орнамент: вертикальное и горизонтальное ребро жёсткости -->
  <path d="M512 224 L512 798" stroke="#34d399" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round" />
  <path d="M276 472 L748 472" stroke="#34d399" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round" />

  <!-- Центральный умбон (выпуклая металлическая бляха в центре античного щита) -->
  <circle cx="512" cy="472" r="88" fill="#064e3b" stroke="#6ee7b7" stroke-width="8" />
  <circle cx="512" cy="472" r="54" fill="url(#shieldMain)" />
  <circle cx="496" cy="456" r="18" fill="#d1fae5" opacity="0.65" />

  <!-- Декоративные заклёпки по периметру обода -->
  <g fill="#a7f3d0">
    <circle cx="512" cy="180" r="6" />
    <circle cx="232" cy="252" r="6" />
    <circle cx="792" cy="252" r="6" />
    <circle cx="256" cy="472" r="6" />
    <circle cx="768" cy="472" r="6" />
    <circle cx="348" cy="692" r="6" />
    <circle cx="676" cy="692" r="6" />
    <circle cx="512" cy="846" r="6" />
  </g>
</svg>